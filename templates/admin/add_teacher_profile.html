{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить преподавателя — PMVK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/form.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/teacher_form.css' %}">
</head>
<body>

<header>
    <div class="wrap">
        <a href="{% url 'dashboard-admin' %}" class="logo"><i>P</i> PMVK</a>
        <div class="user-box">
            <span class="user-name">{{ request.user.get_username }}</span>
            <!-- Замени 'logout' на имя своего url выхода -->
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn-ghost">Выйти</button>
            </form>
        </div>
    </div>
</header>

<main class="form-page">
    <div class="wrap">
        <a href="{% url 'dashboard-admin' %}" class="back">← К списку преподавателей</a>

        <div class="login form-card">
            <h2>Новый преподаватель</h2>
            <p class="sub">Создайте аккаунт и заполните контактные данные</p>

            {% if fail %}
                <div class="msg error" role="alert">{{ fail }}</div>
            {% endif %}

            <form method="post" id="teacherForm">
                {% csrf_token %}

                <div class="field">
                    <label for="username">Логин</label>
                    <div class="input-box">
                        <input type="text" id="username" name="username" value="{{ request.POST.username }}" autocomplete="off" placeholder="Например, ivanov">
                    </div>
                </div>

                <div class="field">
                    <label for="password">Пароль</label>
                    <div class="input-box has-eye">
                        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="От 8 до 25 символов">
                        <button type="button" class="eye" id="togglePass" aria-label="Показать пароль">
                            <!-- перечёркнутый глаз: пароль скрыт -->
                            <svg class="closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a19.8 19.8 0 0 1-3.17 4.19M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="M1 1l22 22"/></svg>
                            <!-- открытый глаз: пароль виден -->
                            <svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="email">Email <span class="opt">необязательно</span></label>
                        <div class="input-box">
                            <input type="email" id="email" name="email" value="{{ request.POST.email }}" autocomplete="off" placeholder="name@example.com">
                        </div>
                    </div>
                    <div class="field">
                        <label for="phone">Телефон <span class="opt">необязательно</span></label>
                        <div class="input-box">
                            <input type="tel" id="phone" name="phone" value="{{ request.POST.phone }}" autocomplete="off" placeholder="+7 700 000 00 00">
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label for="address">Адрес <span class="opt">необязательно</span></label>
                    <div class="input-box">
                        <textarea id="address" name="address" rows="3" placeholder="Город, улица, дом">{{ request.POST.address }}</textarea>
                    </div>
                </div>

                <div class="actions">
                    <a href="{% url 'dashboard-admin' %}" class="btn-cancel">Отмена</a>
                    <button type="submit" class="btn" id="submitBtn">Добавить</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer>
    <div class="wrap">
        <span>© <span id="year"></span> PMVK</span>
        <span>Панель администратора</span>
    </div>
</footer>

<script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const pass = document.getElementById('password');
    const eye = document.getElementById('togglePass');

    // Глазок: скрыт -> перечёркнутый, виден -> открытый
    eye.addEventListener('click', () => {
        const show = pass.type === 'password';
        pass.type = show ? 'text' : 'password';
        eye.classList.toggle('shown', show);
        eye.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
    });

    // Защита от двойной отправки
    document.getElementById('teacherForm').addEventListener('submit', () => {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Сохраняем…';
    });
</script>
</body>
</html>
